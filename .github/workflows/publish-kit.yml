name: Publish kit

# Publish @open-state/kit to npm so other repos (alberta-assisted-living, DATS, …)
# can pin it. Only a protected `kit-v*` tag can publish.
#
# Auth uses the NPM_TOKEN repo secret (an npm automation token for the @open-state
# org). Publishing is idempotent-ish: npm rejects re-publishing an existing
# version, which is the desired safety.

on:
  push:
    tags: ["kit-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: |
          pnpm typecheck
          pnpm test
          pnpm check:pii
          pnpm build

      # On a tag push, the tag version must match the package version, so a
      # mistagged release can't publish the wrong number.
      - name: Verify tag matches kit version
        run: |
          tag="${GITHUB_REF#refs/tags/kit-v}"
          pkg=$(node -p "require('./kit/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag kit-v$tag does not match kit/package.json version $pkg" >&2
            exit 1
          fi
          echo "Publishing @open-state/kit@$pkg"

      - name: Configure npm auth
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (public, with provenance)
        run: pnpm --filter @open-state/kit publish --no-git-checks --access public --provenance
