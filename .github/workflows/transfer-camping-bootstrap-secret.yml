name: Transfer camping npm bootstrap secret

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Ephemeral RSA public key, PEM encoded as base64
        required: true
        type: string

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - name: Encrypt bootstrap token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          umask 077
          printf '%s' "$PUBLIC_KEY" | base64 --decode > public.pem
          printf '%s' "$NPM_TOKEN" |
            openssl pkeyutl -encrypt -pubin -inkey public.pem -out npm-token.enc
          test -s npm-token.enc
          rm public.pem

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-npm-bootstrap-token
          path: npm-token.enc
          retention-days: 1
